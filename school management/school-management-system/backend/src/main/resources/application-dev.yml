spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_management}
    username: ${DB_USERNAME:school_app}
    password: ${DB_PASSWORD:local_dev_only_password}

app:
  security:
    jwt:
      # Throwaway local value. Never reuse it anywhere else; production must set JWT_SIGNING_SECRET.
      secret: ${JWT_SIGNING_SECRET:dev-only-signing-secret-not-for-production-use-0123456789}
    cookie:
      secure: ${COOKIE_SECURE:false}
  seed:
    # Demo accounts (admin@demo.school, teacher@demo.school, student@demo.school) use this password.
    demo-password: ${DEMO_PASSWORD:Demo@Pass2026!}

logging:
  level:
    com.schoolmanagement: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
