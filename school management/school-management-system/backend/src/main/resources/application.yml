spring:
  application:
    name: school-management-system
  profiles:
    default: dev
  autoconfigure:
    # Authentication is provided by the application itself (Phase 2); never generate a default user/password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # One file is at most app.uploads.max-file-bytes; a submission may carry app.uploads.max-submission-files.
      max-file-size: 10MB
      max-request-size: 55MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pagination:
    default-page-size: 20
    max-page-size: 100
  uploads:
    # Only `local` exists; another FileStorage implementation (S3-compatible, Oracle Object Storage) would add a provider.
    provider: ${FILE_STORAGE_PROVIDER:local}
    local-path: ${FILE_STORAGE_PATH:./data/uploads}
    max-file-bytes: 10485760
    max-assignment-files: 10
    max-submission-files: 5
  attendance:
    teacher-backdate-days: ${ATTENDANCE_TEACHER_BACKDATE_DAYS:7}
    default-threshold-percent: ${ATTENDANCE_THRESHOLD_PERCENT:75}
  fees:
    due-soon-days: ${FEE_DUE_SOON_DAYS:14}
  mail:
    from: ${MAIL_FROM:noreply@school.example}
  security:
    jwt:
      # No default: must be supplied (at least 32 bytes). The dev and test profiles provide throwaway values.
      secret: ${JWT_SIGNING_SECRET}
      issuer: school-management-system
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    cookie:
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Lax}
      access-token-name: access_token
      refresh-token-name: refresh_token
    lockout:
      max-failed-attempts: 5
      lock-duration: PT15M
    rate-limit:
      max-failed-logins-per-ip: 30
      max-failed-logins-per-identifier: 10
      max-password-reset-requests-per-ip: 5
      window: PT15M
    password-reset:
      token-ttl: PT30M
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  bootstrap:
    admin-email: ${INITIAL_ADMIN_EMAIL:}
    admin-password: ${INITIAL_ADMIN_PASSWORD:}
    school-name: ${INITIAL_SCHOOL_NAME:My School}
    school-code: ${INITIAL_SCHOOL_CODE:SCHOOL}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
